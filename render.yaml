services:
  - type: web
    name: tenderly-api
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard from Neon connection string
      - key: CORS_ORIGIN
        value: https://tenderly.netlify.app
      - key: OPENAI_API_KEY
        sync: false   # Optional — AI-powered synopsis
